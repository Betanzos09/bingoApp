<app-header></app-header>
<main class="draw-page">
  <div class="draw-heading"><div><div class="eyebrow">SORTEO {{ numbers.length }}</div><h1>El bombo</h1></div><span class="progress">{{ calledCount }} / {{ numbers.length }}</span></div>
  <section class="draw-stage" aria-live="polite">
    <div class="draw-ball" [class.draw-ball--empty]="!lastBall"><div class="draw-ball__face"><span>{{ lastBall || '—' }}</span></div></div>
    <div class="draw-controls"><p>{{ lastBall ? 'Ha salido el número' : 'Pulsa para sacar la primera bola' }}</p><button class="button button--primary" type="button" (click)="nextBall()" [disabled]="calledCount === numbers.length">{{ calledCount === numbers.length ? 'Sorteo completo' : 'Sacar número' }}</button><button class="button" type="button" (click)="reset()">Reiniciar sorteo</button></div>
  </section>
  <section class="led-panel" aria-label="Listado de números del sorteo"><div class="led-panel__header"><span>NÚMEROS EXTRAÍDOS</span><span>{{ calledCount }} / {{ numbers.length }}</span></div><div class="led-grid"><span *ngFor="let number of numbers" class="led-number" [class.led-number--called]="numbersCalled[number - 1]">{{ number | number:'2.0-0' }}</span></div></section>
</main>
